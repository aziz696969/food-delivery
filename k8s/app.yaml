apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: food-delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, value: postgres}
            - {name: POSTGRES_DB, value: orders}
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: init-db}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: food-delivery}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: food-delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      enableServiceLinks: false
      containers:
        - {name: redis, image: "redis:7"}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: food-delivery}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: discovery-server, namespace: food-delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: discovery-server}}
  template:
    metadata: {labels: {app: discovery-server}}
    spec:
      enableServiceLinks: false
      containers:
        - name: discovery-server
          image: siwarsrairi/discovery-server:1.0
          ports: [{containerPort: 8761}]
---
apiVersion: v1
kind: Service
metadata: {name: discovery-server, namespace: food-delivery}
spec:
  selector: {app: discovery-server}
  ports: [{port: 8761}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: food-delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: siwarsrairi/api-gateway:1.2
          ports: [{containerPort: 8080}]
          env:
            - {name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://discovery-server:8761/eureka"}
            - {name: SPRING_DATA_REDIS_HOST, value: redis}
            - {name: SPRING_DATA_REDIS_PORT, value: "6379"}
            - {name: FDP_SECURITY_JWK_SET_URI, value: "http://192.168.58.1:8180/realms/fdp/protocol/openid-connect/certs"}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: food-delivery}
spec:
  selector: {app: api-gateway}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: restaurant-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: restaurant-service}}
  template:
    metadata: {labels: {app: restaurant-service}}
    spec:
      enableServiceLinks: false
      containers:
        - name: restaurant-service
          image: siwarsrairi/restaurant-service:1.0
          ports: [{containerPort: 8082}]
          env:
            - {name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://discovery-server:8761/eureka"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/restaurants"}
            - {name: SPRING_DATASOURCE_USERNAME, value: postgres}
            - {name: SPRING_DATASOURCE_PASSWORD, value: postgres}
            - {name: FDP_SECURITY_JWK_SET_URI, value: "http://192.168.58.1:8180/realms/fdp/protocol/openid-connect/certs"}
---
apiVersion: v1
kind: Service
metadata: {name: restaurant-service, namespace: food-delivery}
spec:
  selector: {app: restaurant-service}
  ports: [{port: 8082}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: food-delivery-frontend, namespace: food-delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: food-delivery-frontend}}
  template:
    metadata: {labels: {app: food-delivery-frontend}}
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: siwarsrairi/food-delivery-frontend:1.2
          ports: [{containerPort: 80}, {containerPort: 443}]
          volumeMounts:
            - {name: certs, mountPath: /etc/nginx/certs, readOnly: true}
      volumes:
        - name: certs
          secret: {secretName: tls-certs}
---
apiVersion: v1
kind: Service
metadata: {name: food-delivery-frontend, namespace: food-delivery}
spec:
  type: NodePort
  selector: {app: food-delivery-frontend}
  ports:
    - {name: http, port: 80, targetPort: 80, nodePort: 30080}
    - {name: https, port: 443, targetPort: 443, nodePort: 30444}
